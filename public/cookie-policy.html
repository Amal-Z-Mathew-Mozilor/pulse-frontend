<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Policy — Pulse</title>
    <!-- TEST HARNESS: sets test cookies for the CookieYes scan. Remove when done. -->
    <script src="/test-cookies.js"></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.6;
        background: #ffffff;
        color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #e6e6e6; }
        a { color: #7aa2ff; }
      }
      .wrap { max-width: 860px; margin: 0 auto; padding: 48px 24px 96px; }
      header { margin-bottom: 32px; }
      header .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      header .sub { font-size: 13px; opacity: 0.6; margin-top: 2px; }
      h1 { font-size: 28px; margin: 24px 0 8px; letter-spacing: -0.02em; }
      .back { display: inline-block; margin-top: 32px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">Pulse</div>
        <div class="sub">Organizational memory</div>
      </header>

      <!-- TEST HARNESS: ?lang=xx overrides the page language before CookieYes reads it.
           CookieYes resolves the policy language from document.documentElement.lang on
           window load, so this must run BEFORE the script tag below. Remove when done. -->
      <script>
        (function () {
          var q = new URLSearchParams(window.location.search).get('lang');
          if (q !== null) document.documentElement.lang = q;
        })();
      </script>

      <!-- CookieYes injects the policy content immediately after this script tag. -->
      <!-- Start CookieYes cookie policy -->
      <script id="cky-cookie-policy" type="text/javascript" src="https://cdn.cookieyes-uat.com/client_data/a78e4d7fc05e1a50bab69879fe41a17a/cookie-policy/script.js"></script>
      <!-- End CookieYes cookie policy -->

      <!-- WORKAROUND (temporary): redraw the cookie table from the Romanian bucket.
           The policy script draws the table in the policy language (English); this waits
           for that table, then re-renders it with the 'ro' cookie list. Must stay AFTER the
           CookieYes cookie-policy script. Remove once the CPG fix ships. -->
      <script>
        (function () {
          var tries = 0;
          var timer = setInterval(function () {
            var el = document.querySelector('.cky-audit-table-element');
            if (el && el.children.length && typeof renderEmbeddedCookieList === 'function') {
              renderEmbeddedCookieList('ro', 'ro');
              clearInterval(timer);
            } else if (++tries > 50) {
              clearInterval(timer); // give up after ~10s
            }
          }, 200);
        })();
      </script>

      <a class="back" href="/">← Back to Pulse</a>
    </div>
  </body>
</html>
